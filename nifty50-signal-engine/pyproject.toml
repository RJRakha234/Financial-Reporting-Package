[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty50-signal-engine"
version = "0.1.0"
description = "Alert-only, read-only signal engine for NSE Nifty 50 constituents."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
kite = ["kiteconnect>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "pandas-stubs", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "DTZ", "PD"]
ignore = [
    "ANN401",  # Any is used deliberately at broker-SDK boundaries.
    "PD008",   # .at[] is the correct accessor for scalar reads; .loc[] is not.
]

[tool.ruff.lint.per-file-ignores]
# Tests construct naive datetimes on purpose, to prove they are rejected.
"tests/*" = ["ANN", "E501", "DTZ001", "DTZ005"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["nifty50"]

[[tool.mypy.overrides]]
module = ["kiteconnect.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
