name: Claude Code Review

# Automation mode: a `prompt` is supplied, so Claude reviews every pull request
# without waiting for a mention. `track_progress` posts a tracking comment on
# the PR and updates it as the review proceeds, so findings land on the PR
# itself rather than only in the workflow run log.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Skip drafts, and skip fork PRs: GitHub withholds secrets from fork-triggered
    # runs, so the job would only fail on a missing ANTHROPIC_API_KEY.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The repository holds two independent
            Python projects; review only what the diff actually touches.

            **fincheck/** — reads a financial-statement PDF and verifies that
            every total and subtotal foots, then writes a colour-highlighted
            copy. Pay attention to:
            - Number parsing: thousands separators, parenthesised negatives,
              currency symbols and codes, nil dashes. A missed format silently
              drops a figure from a subtotal.
            - Comparison tolerance and rounding. Off-by-rounding is a real
              finding here, not a nitpick.
            - Component isolation: totals whose inputs cannot be determined must
              be reported as unverified, never as passing.
            - The CLI exit code contract: 1 when inconsistencies are found,
              0 when everything foots. Pipelines depend on it.

            **nifty50-signal-engine/** — an alert-only NSE Nifty 50 data and
            signal engine. Pay attention to:
            - The alert-only invariant. Flag anything that moves toward placing
              orders or mutating broker state.
            - Timezone discipline. Every datetime must be timezone-aware;
              naive datetimes are rejected deliberately.
            - Corporate actions must back-adjust both price and volume.
            - Look-ahead and survivorship bias in anything touching historical
              data, universe construction or backtesting.
            - Store and calendar correctness: partitioning, session boundaries,
              holidays, muhurat sessions, gap and duplicate handling.
            - `ruff` and `mypy --strict` are expected to stay clean, and new
              behaviour is expected to come with tests.

            For both projects, also check error handling, edge cases and test
            coverage of the changed lines.

            Leave inline comments on specific lines for specific problems. Use a
            top-level comment for general observations. Report what you are
            confident is wrong; do not pad the review with speculation.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
